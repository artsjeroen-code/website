<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>🐷 Moddervarken</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#3b2a20;font-family:system-ui,sans-serif;overflow:hidden}
    main{width:100vw;height:100vh;position:relative;display:grid;place-items:center;background:#2b211b}
    img{width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.15) brightness(.85)}
    .label{position:absolute;left:50%;top:6%;transform:translateX(-50%) rotate(-2deg);padding:.45rem .8rem;background:rgba(59,42,32,.85);color:#f2d6c3;border:3px solid #8a5f43;border-radius:12px;font-size:clamp(1.5rem,4vw,3.5rem);font-weight:900;box-shadow:0 6px 20px rgba(0,0,0,.45);text-align:center}
    footer{position:absolute;right:10px;bottom:8px;padding:.2rem .45rem;background:rgba(0,0,0,.55);color:#ddd;border-radius:6px;font-size:11px}
    footer a{color:#fff}
  </style>
</head>
<body>
  <main>
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5a/A_pig_in_mud%5E_-_geograph.org.uk_-_7282868.jpg" alt="Een varken in de modder">
    <div class="label">Lekker modderig 🐷</div>
    <footer>Foto: N Chadwick / Geograph, <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a></footer>
  </main>
</body>
</html>
