# Focus Timer production API routes.
# Include this file inside the HTTPS server block for artsjeroen.ddns.net.

location = /tools/focus/api/health {
    proxy_pass http://127.0.0.1:8769/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /tools/focus/api/auth/status {
    proxy_pass http://127.0.0.1:8769/auth/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

