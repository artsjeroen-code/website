
# Beam Me Up - staging
# Alleen opnemen in het HTTPS-serverblok
# van test-artsjeroen.ddns.net.

location = /tools/klembord/api {
    return 404;
}

# Strengere beperking voor inloggen
location = /tools/klembord/api/auth/login {
    limit_req zone=beam_login burst=2 nodelay;

    proxy_pass http://127.0.0.1:8770/auth/login;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20k;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Overige beveiligde API-routes
location ^~ /tools/klembord/api/ {
    limit_req zone=beam_api burst=10 nodelay;

    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering on;
    client_max_body_size 20k;

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
