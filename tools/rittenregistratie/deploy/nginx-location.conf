# Voeg deze blokken toe binnen het bestaande HTTPS server { ... } blok voor artsjeroen.ddns.net.
#
# De gebruikersnaam/wachtwoordhash staat alleen op de Raspberry Pi in:
#   /etc/nginx/rittenregistratie.htpasswd
#
# Maak dat bestand bijvoorbeeld met:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/rittenregistratie.htpasswd <gebruikersnaam>
#   sudo chown root:www-data /etc/nginx/rittenregistratie.htpasswd
#   sudo chmod 640 /etc/nginx/rittenregistratie.htpasswd

# Beveilig de volledige webtool (HTML/CSS/JS).
location /tools/rittenregistratie/ {
    auth_basic "Rittenregistratie";
    auth_basic_user_file /etc/nginx/rittenregistratie.htpasswd;

    try_files $uri $uri/ =404;
}

# De API is een specifiekere location en moet daarom óók expliciet auth krijgen.
location /tools/rittenregistratie/api/ {
    auth_basic "Rittenregistratie";
    auth_basic_user_file /etc/nginx/rittenregistratie.htpasswd;

    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store";
}
