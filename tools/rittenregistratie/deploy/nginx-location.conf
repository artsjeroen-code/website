# Voeg deze blokken toe binnen het bestaande HTTPS server { ... } blok voor artsjeroen.ddns.net.
#
# Architectuur:
# - statische tool en normale /api/ routes vereisen een geldige passkey-sessie;
# - login.html, passkey.js en auth.css zijn publiek zodat de login kan laden;
# - login/status/logout gaan rechtstreeks naar de auth-service op 127.0.0.1:8766;
# - alleen passkey-registratie blijft achter de bestaande Basic Auth als bootstrap/herstelpad;
# - ritten-API blijft draaien op 127.0.0.1:8765.
#
# Bestaand wachtwoordbestand op de Raspberry Pi:
#   /etc/nginx/rittenregistratie.htpasswd

# Interne subrequest waarmee Nginx een sessie valideert.
location = /tools/rittenregistratie/auth-check {
    internal;
    proxy_pass http://127.0.0.1:8766/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
}

# Publieke loginbestanden. Deze bevatten geen ritdata.
location = /tools/rittenregistratie/login.html {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/passkey.js {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/auth.css {
    try_files $uri =404;
}
location = /tools/rittenregistratie/icons/icon-192.svg {
    try_files $uri =404;
}

# Publieke auth-endpoints die nodig zijn vóór het inloggen.
location = /tools/rittenregistratie/api/auth/status {
    proxy_pass http://127.0.0.1:8766/api/auth/status;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/api/auth/login/begin {
    proxy_pass http://127.0.0.1:8766/api/auth/login/begin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/api/auth/login/complete {
    proxy_pass http://127.0.0.1:8766/api/auth/login/complete;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/api/auth/logout {
    proxy_pass http://127.0.0.1:8766/api/auth/logout;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}

# Bootstrap/herstel: alleen voor het registreren van een (extra) passkey.
location = /tools/rittenregistratie/api/auth/register/begin {
    auth_basic "Rittenregistratie - passkey registreren";
    auth_basic_user_file /etc/nginx/rittenregistratie.htpasswd;

    proxy_pass http://127.0.0.1:8766/api/auth/register/begin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}
location = /tools/rittenregistratie/api/auth/register/complete {
    auth_basic "Rittenregistratie - passkey registreren";
    auth_basic_user_file /etc/nginx/rittenregistratie.htpasswd;

    proxy_pass http://127.0.0.1:8766/api/auth/register/complete;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store";
}

# De app-shell zelf is alleen bereikbaar met een geldige passkey-sessie.
location /tools/rittenregistratie/ {
    auth_request /tools/rittenregistratie/auth-check;
    error_page 401 =302 /tools/rittenregistratie/login.html;
    try_files $uri $uri/ =404;
}

# Alle bestaande ritten-API-routes vereisen dezelfde sessie.
location /tools/rittenregistratie/api/ {
    auth_request /tools/rittenregistratie/auth-check;

    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store";
}
