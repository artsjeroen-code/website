# Voeg dit location-blok toe binnen het bestaande HTTPS server { ... } blok
# voor artsjeroen.ddns.net, vóór de generieke /tools/rittenregistratie/api/ location.
#
# Deze route gebruikt bewust geen auth_request-sessie: iOS Opdrachten heeft die
# browsercookie niet. De Shortcut API controleert zelf een lang geheim Bearer-token.
location = /tools/rittenregistratie/api/shortcut {
    proxy_pass http://127.0.0.1:8767/api/shortcut;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    client_max_body_size 8k;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store";
}
