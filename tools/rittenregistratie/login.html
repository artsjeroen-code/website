<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#4285f4">
  <title>Inloggen – Rittenregistratie</title>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('startpagina-theme') || 'dark';
      document.documentElement.dataset.theme = savedTheme;
    })();
  </script>
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="auth.css">
  <script src="../../staging.js"></script>
  <link rel="stylesheet" href="../../staging.css">
</head>
<body>
  <main class="auth-card">
    <p class="auth-kicker">Rittenregistratie</p>
    <h1>Inloggen</h1>
    <p id="authStatus">Authenticatie controleren…</p>

    <div class="auth-actions">
      <form id="passwordLoginForm" class="password-login" hidden>
        <label for="passwordInput">Wachtwoord</label>
        <div class="password-row">
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
          <button class="secondary" type="submit">Inloggen met wachtwoord</button>
        </div>
      </form>

      <a class="secondary home-link" href="../../">Terug naar startpagina</a>
    </div>
    <p id="authMessage" role="status" aria-live="polite"></p>
  </main>
  <script src="password-login.js"></script>
</body>
</html>
