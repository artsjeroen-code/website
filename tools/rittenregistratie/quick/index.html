<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Snelle ritregistratie</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); background: Canvas; color: CanvasText; }
    main { width: min(100%, 420px); text-align: center; }
    h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 7vw, 2.2rem); }
    p { margin: 0 0 22px; line-height: 1.45; opacity: .72; }
    button { width: 100%; min-height: 72px; border: 0; border-radius: 18px; padding: 16px 20px; font: inherit; font-size: 1.15rem; font-weight: 700; background: #1a73e8; color: #fff; }
    button.end { background: #d93025; }
    button:disabled { opacity: .55; }
    #status { min-height: 52px; margin-top: 20px; padding: 14px; border-radius: 14px; background: color-mix(in srgb, CanvasText 7%, transparent); text-align: left; font-size: .95rem; }
    #status.success { background: color-mix(in srgb, #188038 16%, transparent); }
    #status.error { background: color-mix(in srgb, #d93025 14%, transparent); }
    a { display: inline-block; margin-top: 22px; color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Snelle ritregistratie</h1>
    <p id="intro">Locatie, adres en tijd worden als concept opgeslagen.</p>
    <button id="captureButton" type="button">Laden…</button>
    <div id="status" aria-live="polite">Controleer de actie en tik daarna op de knop.</div>
    <a href="../">Naar rittenregistratie</a>
  </main>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const requestedAction = params.get('action');
      const action = requestedAction === 'end' ? 'end' : 'start';
      const title = document.getElementById('title');
      const intro = document.getElementById('intro');
      const button = document.getElementById('captureButton');
      const status = document.getElementById('status');

      title.textContent = action === 'start' ? 'Begin rit' : 'Einde rit';
      intro.textContent = action === 'start'
        ? 'Registreer vertrekpunt, tijd en locatie.'
        : 'Registreer aankomstpunt, tijd en locatie.';
      button.textContent = action === 'start' ? 'Beginpunt registreren' : 'Eindpunt registreren';
      button.classList.toggle('end', action === 'end');

      function localCapturedAt(date = new Date()) {
        const datePart = [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
        const timePart = [date.getHours(), date.getMinutes(), date.getSeconds()].map((v) => String(v).padStart(2, '0')).join(':');
        return `${datePart}T${timePart}`;
      }

      function setStatus(text, type = '') {
        status.textContent = text;
        status.className = type;
      }

      async function api(path, options = {}) {
        const response = await fetch(`../api${path}`, {
          cache: 'no-store',
          credentials: 'same-origin',
          headers: {
            Accept: 'application/json',
            ...(options.body ? { 'Content-Type': 'application/json' } : {})
          },
          ...options
        });
        let payload = {};
        try { payload = await response.json(); }
        catch { throw new Error(`API gaf geen geldig antwoord (HTTP ${response.status}).`); }
        if (!response.ok) {
          if (response.status === 401) throw new Error('Je bent niet ingelogd. Open eerst de rittenregistratie en log in.');
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        return payload;
      }

      function getLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('Deze browser ondersteunt geen locatiebepaling.'));
            return;
          }
          navigator.geolocation.getCurrentPosition(
            (position) => resolve({
              lat: Number(position.coords.latitude.toFixed(6)),
              lon: Number(position.coords.longitude.toFixed(6)),
              accuracy: Math.round(position.coords.accuracy || 0)
            }),
            (error) => {
              const messages = {
                1: 'Locatietoegang is geweigerd. Sta locatie toe voor deze website.',
                2: 'De huidige locatie kon niet worden bepaald.',
                3: 'Locatiebepaling duurde te lang.'
              };
              reject(new Error(messages[error.code] || 'Locatie bepalen is mislukt.'));
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 15000 }
          );
        });
      }

      async function reverseGeocode(coords) {
        const query = new URLSearchParams({
          format: 'jsonv2', lat: String(coords.lat), lon: String(coords.lon), zoom: '18', addressdetails: '1', 'accept-language': 'nl'
        });
        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?${query}`, { headers: { Accept: 'application/json' } });
          if (!response.ok) return `GPS ${coords.lat}, ${coords.lon}`;
          const result = await response.json();
          const address = result.address || {};
          const road = address.road || address.pedestrian || address.residential || '';
          const street = [road, address.house_number || ''].filter(Boolean).join(' ');
          const locality = [address.postcode || '', address.city || address.town || address.village || address.municipality || ''].filter(Boolean).join(' ');
          return [street, locality].filter(Boolean).join(', ') || result.display_name || `GPS ${coords.lat}, ${coords.lon}`;
        } catch {
          return `GPS ${coords.lat}, ${coords.lon}`;
        }
      }

      async function capture() {
        button.disabled = true;
        setStatus('Locatie bepalen…');
        try {
          const capturedAt = localCapturedAt();
          const coords = await getLocation();
          setStatus('Adres opzoeken…');
          const address = await reverseGeocode(coords);
          await api(`/quick-rides/${action}`, {
            method: 'POST',
            body: JSON.stringify({ capturedAt, coords, address })
          });
          setStatus(
            action === 'start'
              ? `Beginpunt opgeslagen: ${address}`
              : `Eindpunt opgeslagen: ${address}. De concept-rit kan later worden aangevuld.`,
            'success'
          );
        } catch (error) {
          setStatus(error.message, 'error');
          button.disabled = false;
        }
      }

      button.addEventListener('click', capture);
    })();
  </script>
</body>
</html>
