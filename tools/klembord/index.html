<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>Beam Me Up</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('startpagina-theme') || 'dark';
  </script>
  <link rel="stylesheet" href="../../google_palette.css">
  <link rel="stylesheet" href="../../utility-rail.css">
  <link rel="stylesheet" href="./style.css">
  <script src="../../staging.js"></script>
  <link rel="stylesheet" href="../../staging.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <aside class="utility-rail" aria-label="Snelkoppelingen">
    <button class="rail-button rail-theme" id="railTheme" type="button" aria-label="Wissel licht/donker thema" title="Thema">
      <span class="rail-icon icon-theme" aria-hidden="true"></span>
    </button>

    <a class="rail-button" href="../../" aria-label="Terug naar startpagina" title="Startpagina">
      <span class="rail-icon icon-home" aria-hidden="true"></span>
    </a>
    <a class="rail-button" href="../focus/" aria-label="Focus Timer" title="Focus Timer">
      <span class="rail-icon icon-focus" aria-hidden="true"></span>
    </a>
    <a class="rail-button" href="../ademhaling/" aria-label="Ademhalingstool" title="Ademhalingstool">
      <span class="rail-icon icon-lotus" aria-hidden="true"></span>
    </a>
    <a class="rail-button" href="../rittenregistratie/" aria-label="Rittenregistratie" title="Rittenregistratie"><span class="rail-icon" aria-hidden="true" style="background-image:url('../../icons/rittenregistratie.svg')"></span></a>

    <div class="rail-separator" aria-hidden="true"></div>

    <a class="rail-button" href="https://chatgpt.com/" target="_blank" rel="noopener" aria-label="ChatGPT" title="ChatGPT"><span class="rail-icon icon-chatgpt" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://web.whatsapp.com/" target="_blank" rel="noopener" aria-label="WhatsApp Web" title="WhatsApp Web"><span class="rail-icon icon-whatsapp" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://mail.google.com/" target="_blank" rel="noopener" aria-label="Gmail" title="Gmail"><span class="rail-icon icon-mail" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://calendar.google.com/" target="_blank" rel="noopener" aria-label="Google Calendar" title="Google Calendar"><span class="rail-icon icon-calendar" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://drive.google.com/" target="_blank" rel="noopener" aria-label="Google Drive" title="Google Drive"><span class="rail-icon icon-drive" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://photos.google.com/" target="_blank" rel="noopener" aria-label="Google Foto's" title="Google Foto's"><span class="rail-icon icon-photos" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://www.google.com/maps" target="_blank" rel="noopener" aria-label="Google Maps" title="Google Maps"><span class="rail-icon icon-map" aria-hidden="true"></span></a>

    <div class="rail-separator" aria-hidden="true"></div>

    <a class="rail-button" href="https://www.rabobank.nl/" target="_blank" rel="noopener" aria-label="Rabobank" title="Rabobank"><span class="rail-icon icon-bank" aria-hidden="true"></span></a>
    <a class="rail-button" href="https://www.marktplaats.nl/" target="_blank" rel="noopener" aria-label="Marktplaats" title="Marktplaats"><span class="rail-icon icon-market" aria-hidden="true"></span></a>
  </aside>
  <main class="beam-shell">
    <section class="beam-card" aria-label="Beam Me Up">
      <header class="tool-header">
        <span class="app-label">Beam Me Up</span>
        <button id="logoutBtn" class="subtle-button" type="button" hidden>Uitloggen</button>
      </header>

      <section id="loginPanel" class="login-panel" hidden>
        <form id="loginForm">
          <label for="password">Wachtwoord</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button class="primary-button" type="submit">Inloggen</button>
        </form>
      </section>

      <section id="clipboardPanel" class="beam-content" hidden>
        <section class="composer" aria-label="Nieuw bericht">
          <h1>Nieuw bericht</h1>
          <form id="messageForm">
            <label class="sr-only" for="message">Berichttekst</label>
            <textarea id="message" rows="10" maxlength="16000"
              placeholder="Typ of plak hier je tekst…" required></textarea>
            <button class="primary-button" type="submit">Versturen</button>
          </form>
          <p class="helper">Berichten zijn op beide apparaten beschikbaar en verdwijnen na 30 minuten.</p>
        </section>

        <section class="feed" aria-label="Berichten">
          <div class="feed-heading">
            <h2>Berichten</h2>
            <button id="refreshBtn" class="subtle-button" type="button">Vernieuwen</button>
          </div>
          <div id="messagesList" aria-live="polite"></div>
        </section>
      </section>
      <p id="statusMessage" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
